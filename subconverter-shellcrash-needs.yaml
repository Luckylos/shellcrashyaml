# ShellCrash 当前实际需求的订阅转换后端模板
# 说明：
# - 这是一份供 Mihomo / 订阅转换后端使用的 YAML 模板，不直接内置节点。
# - 转换后端负责注入订阅节点；本文件只表达当前 ShellCrash 的路由需求、DNS 行为与策略组结构。
# - 基于本机当前生效需求整理：AI 优先美区、Telegram 优先新加坡、国内流量默认直连、其他流量走区域选择。
# - 地区组改为"CFST 优选最高优先，失效自动 fallback 到手动/自动组"。

x-region-auto: &region-auto
  type: url-test
  url: http://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
  include-all: true

x-region-manual: &region-manual
  type: select
  include-all: true

x-region-fallback: &region-fallback
  type: fallback
  url: http://www.gstatic.com/generate_204
  interval: 300

x-filter-hk: &filter-hk "(?i)港|hk|hong ?kong|🇭🇰"
x-filter-jp: &filter-jp "(?i)日|jp|japan|tokyo|🇯🇵"
x-filter-sg: &filter-sg "(?i)新|sg|singapore|🇸🇬"
x-filter-us: &filter-us "(?i)美|us|usa|america|united states|🇺🇸"
x-filter-known-regions: &filter-known "(?i)港|hk|hong ?kong|🇭🇰|日|jp|japan|tokyo|🇯🇵|新|sg|singapore|🇸🇬|美|us|usa|america|united states|🇺🇸"

x-rule-set-domain: &rule-set-domain
  type: http
  behavior: domain
  format: mrs
  interval: 86400

x-rule-set-ipcidr: &rule-set-ipcidr
  type: http
  behavior: ipcidr
  format: mrs
  interval: 86400

mode: rule
mixed-port: 7890
allow-lan: true
ipv6: false
log-level: info
external-controller: ":9090"

# OpenCode 独立出口：每个 listener 固定到一个节点，供 New-API 渠道级 proxy 使用。
# 仅绑定 Docker bridge 网关，避免成为 LAN 开放代理。
listeners:
  - name: opencode-us-cox-1
    type: mixed
    port: 17891
    listen: 172.17.0.1
    proxy: 🇺🇸 US COX ISP

  - name: opencode-us-cox-2
    type: mixed
    port: 17892
    listen: 172.17.0.1
    proxy: 🇺🇸 US COX ISP 2

  - name: opencode-us-home
    type: mixed
    port: 17893
    listen: 172.17.0.1
    proxy: 🇺🇸 US家宽

profile:
  store-selected: true

# DNS
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 1.1.1.1
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localhost"

# CFST Proxy Providers — 由 apply.sh 管理的本地文件
proxy-providers:
  cfst-hk:
    type: file
    path: /opt/cfst/providers/cfst-hk.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 120
  cfst-sg:
    type: file
    path: /opt/cfst/providers/cfst-sg.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 120
  cfst-jp:
    type: file
    path: /opt/cfst/providers/cfst-jp.yaml
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 120

proxy-groups:
  - name: 🚀 节点选择
    type: select
    proxies:
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇺🇸 美国
      - 其余地区
      - DIRECT

  - name: 🤖 AI 服务
    type: select
    proxies:
      - 🇺🇸 美国
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 其余地区
      - 🚀 节点选择

  - name: 📲 Telegram
    type: select
    proxies:
      - 🇸🇬 新加坡
      - 🇭🇰 香港
      - 🇯🇵 日本
      - 🇺🇸 美国
      - 其余地区
      - 🚀 节点选择

  - name: 🎯 国内流量
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🇭🇰 香港

  # ── 地区入口：CFST 优先 → 手动 → 自动 → 跨区 fallback ──
  - name: 🇭🇰 香港
    <<: *region-fallback
    proxies:
      - 🇭🇰 香港-CFST
      - 🇭🇰 香港-手动
      - 🇭🇰 香港-自动
      - 🇸🇬 新加坡-自动
      - 🇯🇵 日本-自动

  - name: 🇯🇵 日本
    <<: *region-fallback
    proxies:
      - 🇯🇵 日本-CFST
      - 🇯🇵 日本-手动
      - 🇯🇵 日本-自动
      - 🇸🇬 新加坡-自动
      - 🇭🇰 香港-自动

  - name: 🇸🇬 新加坡
    <<: *region-fallback
    proxies:
      - 🇸🇬 新加坡-CFST
      - 🇸🇬 新加坡-手动
      - 🇸🇬 新加坡-自动
      - 🇭🇰 香港-自动
      - 🇯🇵 日本-自动

  - name: 🇺🇸 美国
    <<: *region-fallback
    proxies:
      - 🇺🇸 美国-手动
      - 🇺🇸 美国-自动
      - 🇯🇵 日本-自动
      - 🇸🇬 新加坡-自动
      - 🇭🇰 香港-自动

  - name: 其余地区
    <<: *region-fallback
    proxies:
      - 其余地区-手动
      - 其余地区-自动

  # ── CFST 组：url-test 多节点负载均衡 ──
  - name: 🇭🇰 香港-CFST
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 50
    use:
      - cfst-hk

  - name: 🇯🇵 日本-CFST
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 50
    use:
      - cfst-jp

  - name: 🇸🇬 新加坡-CFST
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 120
    tolerance: 50
    use:
      - cfst-sg

  # ── 手动选择 ──
  - name: 🇭🇰 香港-手动
    <<: *region-manual
    filter: *filter-hk

  - name: 🇯🇵 日本-手动
    <<: *region-manual
    filter: *filter-jp

  - name: 🇸🇬 新加坡-手动
    <<: *region-manual
    filter: *filter-sg

  - name: 🇺🇸 美国-手动
    <<: *region-manual
    filter: *filter-us

  - name: 其余地区-手动
    <<: *region-manual
    exclude-filter: *filter-known

  # ── 自动选择 ──
  - name: 🇭🇰 香港-自动
    <<: *region-auto
    filter: *filter-hk

  - name: 🇯🇵 日本-自动
    <<: *region-auto
    filter: *filter-jp

  - name: 🇸🇬 新加坡-自动
    <<: *region-auto
    filter: *filter-sg

  - name: 🇺🇸 美国-自动
    <<: *region-auto
    filter: *filter-us

  - name: 其余地区-自动
    <<: *region-auto
    exclude-filter: *filter-known

rule-providers:
  AI:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/AI.mrs
  China:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/China.mrs
  ChinaIP:
    <<: *rule-set-ipcidr
    url: https://github.com/666OS/rules/raw/release/mihomo/ip/China.mrs
  Telegram:
    <<: *rule-set-domain
    url: https://github.com/666OS/rules/raw/release/mihomo/domain/Telegram.mrs
  TelegramIP:
    <<: *rule-set-ipcidr
    url: https://github.com/666OS/rules/raw/release/mihomo/ip/Telegram.mrs

rules:
  # 本地/私网直连
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR6,::1/128,DIRECT,no-resolve
  - IP-CIDR6,fc00::/7,DIRECT,no-resolve
  - IP-CIDR6,fe80::/10,DIRECT,no-resolve

  # AI / Telegram / China
  - DOMAIN-SUFFIX,nvidia.com,🤖 AI 服务
  - RULE-SET,AI,🤖 AI 服务
  - RULE-SET,Telegram,📲 Telegram
  - RULE-SET,TelegramIP,📲 Telegram,no-resolve
  - RULE-SET,China,🎯 国内流量
  - RULE-SET,ChinaIP,🎯 国内流量,no-resolve
  - GEOIP,CN,🎯 国内流量

  # 其他全部走总策略
  - MATCH,🚀 节点选择
